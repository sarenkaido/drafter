name: Build & release

# - Publishing a release on GitHub builds every platform and attaches the files.
# - Actions tab → "Build & release" → Run workflow:
#     publish = true  → builds latest main, creates the release for <tag> if needed, uploads files
#     publish = false → test build only (files kept as workflow artifacts + Android emulator screenshots)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0"
        required: true
      publish:
        description: "Publish to the release (uncheck for a test build)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
  REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.REF }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Build installers
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist-win, out | Out-Null
          Copy-Item src-tauri/target/release/Daftar.exe dist-win/
          if (Test-Path src-tauri/target/release/WebView2Loader.dll) { Copy-Item src-tauri/target/release/WebView2Loader.dll dist-win/ }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          Push-Location installer
          & $nsis /V2 "/DVER=$ver" setup.nsi;    if ($LASTEXITCODE) { exit 1 }
          & $nsis /V2 "/DVER=$ver" portable.nsi; if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          Move-Item installer/Daftar-Setup-*.exe out/Daftar-Windows-Setup.exe
          Move-Item installer/Daftar-Portable-*.exe out/Daftar-Windows-Portable.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  linux:
    # 22.04 keeps the glibc requirement low so the packages run on older distros too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.REF }}" }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles deb appimage
      - name: Collect
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb out/Daftar-Linux-amd64.deb
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/Daftar-Linux-x86_64.AppImage
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.REF }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Generate Android project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          npx tauri android init --ci
          npx tauri icon assets/icon.png
      - name: Build APK
        run: |
          # test builds also include x86_64 so the APK runs in the emulator
          if [ "$PUBLISH" = "true" ]; then T="--target aarch64 --target armv7"; else T="--target aarch64 --target armv7 --target x86_64"; fi
          npx tauri android build --apk $T
      - name: Sign APK
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          echo "unsigned: $IN"
          SIGNED=false
          if [ -n "$KS_B64" ]; then
            # tolerate stray spaces/newlines and invisible characters (e.g. RTL marks) from copy-paste
            printf '%s' "$KS_B64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > ks.jks
            KS_PASS=$(printf '%s' "$KS_PASS" | LC_ALL=C tr -cd '\041-\176')
            echo "keystore: $(stat -c %s ks.jks) bytes, password: ${#KS_PASS} characters"
            SIGNED=true
          else
            echo "::warning::ANDROID_KEYSTORE secret is missing - signing with a throwaway test key (not published)"
            KS_PASS=testpass123
            keytool -genkeypair -keystore ks.jks -storetype PKCS12 -alias daftar -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Daftar Test"
          fi
          mkdir out
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --v4-signing-enabled false --ks ks.jks --ks-key-alias daftar --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out out/Daftar-Android.apk aligned.apk
          "$BT/apksigner" verify --print-certs out/Daftar-Android.apk | grep -E "DN|SHA-256"
          rm -f ks.jks
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  # Test builds only: install the APK on an emulator and take screenshots
  android-screens:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/Daftar-Android.apk
            adb shell monkey -p ir.daftar.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > screen-1-start.png
            adb shell wm size
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > screen-2-after-back.png
            adb logcat -d -s RustStdoutStderr:* Tauri:* chromium:* > logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-screens, path: "*.png\nlogcat.txt" }

  publish:
    if: ${{ always() && (github.event_name == 'release' || inputs.publish) && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Create release if needed
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            VER="${TAG#v}"
            cat > notes.md <<EOF
          ## Daftar $VER

          | | Download |
          |---|---|
          | Windows (installer) | Daftar-Windows-Setup.exe |
          | Windows (portable) | Daftar-Windows-Portable.exe |
          | Android | Daftar-Android.apk |
          | Linux (any distro) | Daftar-Linux-x86_64.AppImage |
          | Linux (Debian / Ubuntu) | Daftar-Linux-amd64.deb |
          EOF
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Daftar $VER" --notes-file notes.md
          fi
      - name: Upload files
        run: |
          FILES="dl/windows/* dl/linux/*"
          if [ "${{ needs.android.outputs.signed }}" = "true" ] && ls dl/android/*.apk >/dev/null 2>&1; then FILES="$FILES dl/android/*.apk"; else echo "::warning::Android APK not published (signing key missing or Android build failed)"; fi
          gh release upload "$TAG" $FILES --clobber -R "$GITHUB_REPOSITORY"
