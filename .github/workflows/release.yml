name: Build & attach installers

# Runs automatically when a release is published,
# or manually from the Actions tab (enter the tag, e.g. v1.0.0).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Daftar.exe
        run: npx tauri build --no-bundle

      - name: Build installers
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item src-tauri/target/release/Daftar.exe dist-win/
          if (Test-Path src-tauri/target/release/WebView2Loader.dll) { Copy-Item src-tauri/target/release/WebView2Loader.dll dist-win/ }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location installer
          & $nsis /V2 "/DVER=$ver" setup.nsi;    if ($LASTEXITCODE) { exit 1 }
          & $nsis /V2 "/DVER=$ver" portable.nsi; if ($LASTEXITCODE) { exit 1 }
          Move-Item Daftar-*.exe ../dist-win/
          Pop-Location
          Get-ChildItem dist-win

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.TAG }}" dist-win/Daftar-Setup-*.exe dist-win/Daftar-Portable-*.exe --clobber -R "${{ github.repository }}"
