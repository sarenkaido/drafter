name: Android emulator check

# Installs the APK from an earlier "Build & release" test run on an emulator
# and prints screenshots (base64) into the log.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a Build & release test run"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test script
        run: |
          cat > emu.sh <<'SH'
          set -x
          adb install -r apk/Daftar-Android.apk
          adb shell monkey -p ir.daftar.app -c android.intent.category.LAUNCHER 1
          sleep 45
          shot() { adb exec-out screencap -p > "$1.png"; echo "SHOT-BEGIN $1"; base64 -w 0 "$1.png"; echo; echo "SHOT-END $1"; }
          shot 1-start
          SIZE=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1); W=${SIZE%x*}; H=${SIZE#*x}
          DEN=$(adb shell wm density | grep -o '[0-9]*' | tail -1)
          echo "screen $W x $H density $DEN"
          # floating + button: 45 css px from the left, ~107 css px from the bottom
          X=$((45 * DEN / 160)); Y=$((H - 110 * DEN / 160))
          adb shell input tap $X $Y
          sleep 3
          shot 2-add
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          shot 3-after-back
          adb logcat -d | grep -iE "daftar|tauri|chromium|RustStdout" | tail -40
          SH
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash emu.sh
