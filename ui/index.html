<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c11" />
  <title>Daftar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 14l3-3 2 2 3-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="brand-title" style="letter-spacing:.3px">Daftar</div>
          <div class="brand-sub" data-i18n="brand.sub"></div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span data-i18n="nav.dashboard"></span>
        </button>
        <button class="nav-item" data-view="transactions">
          <svg viewBox="0 0 24 24"><path d="M7 7h13M7 12h13M7 17h13M3.5 7h.01M3.5 12h.01M3.5 17h.01"/></svg>
          <span data-i18n="nav.transactions"></span>
        </button>
        <button class="nav-item" data-view="categories">
          <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
          <span class="l-long" data-i18n="nav.categories"></span><span class="l-short" data-i18n="nav.categoriesShort"></span>
        </button>
        <button class="nav-item" data-view="reports">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span class="l-long" data-i18n="nav.reports"></span><span class="l-short" data-i18n="nav.reportsShort"></span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="l-long" data-i18n="nav.settings"></span><span class="l-short" data-i18n="nav.settingsShort"></span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="balance-mini">
          <div class="muted small" data-i18n="side.balance"></div>
          <div id="sideBalance" class="balance-mini-val">۰</div>
        </div>
        <button id="langToggle" class="ghost-btn lang-btn" data-i18n-title="set.lang"></button>
        <button id="themeToggle" class="ghost-btn" data-i18n-title="theme.toggle">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">داشبورد</h1>
          <div id="pageSub" class="muted small"></div>
        </div>
        <div class="topbar-actions">
          <div class="month-nav" id="monthNav">
            <button class="icon-btn" id="prevMonth" data-i18n-title="month.prev"><svg class="flip-ltr" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
            <button class="month-label" id="monthLabel" data-i18n-title="month.current">—</button>
            <button class="icon-btn" id="nextMonth" data-i18n-title="month.next"><svg class="flip-ltr" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          </div>
          <button class="btn primary" id="addBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span class="lbl" data-i18n="add"></span>
            <kbd>Ctrl+N</kbd>
          </button>
        </div>
      </header>

      <section class="view active" id="view-dashboard">
        <div class="stats">
          <div class="stat income">
            <div class="stat-head"><span class="dot"></span><span data-i18n="st.income"></span></div>
            <div class="stat-val" id="stIncome">۰</div>
            <div class="stat-foot" id="stIncomeCmp"></div>
          </div>
          <div class="stat expense">
            <div class="stat-head"><span class="dot"></span><span data-i18n="st.expense"></span></div>
            <div class="stat-val" id="stExpense">۰</div>
            <div class="stat-foot" id="stExpenseCmp"></div>
          </div>
          <div class="stat net">
            <div class="stat-head"><span class="dot"></span><span data-i18n="st.net"></span></div>
            <div class="stat-val" id="stNet">۰</div>
            <div class="stat-foot" id="stNetFoot"></div>
          </div>
          <div class="stat total">
            <div class="stat-head"><span class="dot"></span><span data-i18n="st.avg"></span></div>
            <div class="stat-val" id="stAvg">۰</div>
            <div class="stat-foot" id="stAvgFoot"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-head">
              <h3 data-i18n="chart.daily"></h3>
              <div class="legend-inline"><span class="lg income"></span><span data-i18n="income"></span> <span class="lg expense"></span><span data-i18n="expense"></span></div>
            </div>
            <canvas id="dailyChart" height="260"></canvas>
          </div>
          <div class="card">
            <div class="card-head"><h3 data-i18n="chart.byCat"></h3></div>
            <div class="donut-wrap">
              <canvas id="donutChart" width="220" height="220"></canvas>
              <div class="donut-center"><div class="muted small" id="donutLabel" data-i18n="donut.total"></div><div id="donutTotal">۰</div></div>
            </div>
            <div id="donutLegend" class="donut-legend"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3 data-i18n="recent"></h3>
            <button class="link-btn" data-goto="transactions" data-i18n="viewAll"></button>
          </div>
          <div id="recentList" class="tx-list"></div>
        </div>
      </section>

      <section class="view" id="view-transactions">
        <div class="filters card">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="fSearch" data-i18n-ph="search.ph" />
          </div>
          <div class="seg" id="fType">
            <button data-v="all" class="on" data-i18n="all"></button>
            <button data-v="expense" data-i18n="expense"></button>
            <button data-v="income" data-i18n="income"></button>
          </div>
          <select id="fCat"></select>
          <label class="check"><input type="checkbox" id="fAllTime" /> <span data-i18n="allMonths"></span></label>
        </div>
        <div class="summary-bar" id="txSummary"></div>
        <div id="txList" class="tx-groups"></div>
      </section>

      <section class="view" id="view-categories">
        <div class="grid-2">
          <div class="card">
            <div class="card-head"><h3><span class="pill expense" data-i18n="expense"></span> <span data-i18n="cat.expenseTitle"></span></h3><button class="btn soft" data-addcat="expense" data-i18n="cat.add"></button></div>
            <div id="catExpense" class="cat-list"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3><span class="pill income" data-i18n="income"></span> <span data-i18n="cat.incomeTitle"></span></h3><button class="btn soft" data-addcat="income" data-i18n="cat.add"></button></div>
            <div id="catIncome" class="cat-list"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-reports">
        <div class="card">
          <div class="card-head">
            <h3 id="yearTitle"></h3>
            <div class="month-nav">
              <button class="icon-btn" id="prevYear" data-i18n-title="year.prev"><svg class="flip-ltr" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
              <span class="month-label static" id="yearLabel">—</span>
              <button class="icon-btn" id="nextYear" data-i18n-title="year.next"><svg class="flip-ltr" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
            </div>
          </div>
          <canvas id="yearChart" height="280"></canvas>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-head"><h3 data-i18n="report.monthly"></h3></div>
            <table class="table" id="yearTable"></table>
          </div>
          <div class="card">
            <div class="card-head"><h3 data-i18n="report.top"></h3></div>
            <div id="yearTopCats" class="bars"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-settings">
        <div class="grid-2">
          <div class="card">
            <div class="card-head"><h3 data-i18n="settings.title"></h3></div>
            <div class="setting">
              <div><div class="s-title" data-i18n="set.lang"></div><div class="muted small" data-i18n="set.langHint"></div></div>
              <div class="seg" id="sLang"><button data-v="fa">فارسی</button><button data-v="en">English</button></div>
            </div>
            <div class="setting">
              <div><div class="s-title" data-i18n="set.cal"></div><div class="muted small" data-i18n="set.calHint"></div></div>
              <div class="seg" id="sCal"><button data-v="jalali" data-i18n="cal.jalali"></button><button data-v="gregorian" data-i18n="cal.gregorian"></button></div>
            </div>
            <div class="setting">
              <div><div class="s-title" data-i18n="set.currency"></div><div class="muted small" data-i18n="set.currencyHint"></div></div>
              <div class="cur-pick"><select id="sCurrency"></select><input id="sCurCustom" class="cur-custom" maxlength="10" data-i18n-ph="cur.customPh" /></div>
            </div>
            <div class="setting">
              <div><div class="s-title" data-i18n="set.theme"></div><div class="muted small" data-i18n="set.themeHint"></div></div>
              <div class="seg" id="sTheme"><button data-v="dark" data-i18n="theme.dark"></button><button data-v="light" data-i18n="theme.light"></button></div>
            </div>
            <div class="setting desktop-only">
              <div><div class="s-title" data-i18n="set.folder"></div><div class="muted small" data-i18n="set.folderHint"></div></div>
              <button class="btn soft" id="openFolder" data-i18n="set.folderBtn"></button>
            </div>
            <div class="setting danger-zone">
              <div><div class="s-title" data-i18n="set.wipe"></div><div class="muted small" data-i18n="set.wipeHint"></div></div>
              <button class="btn danger" id="wipeBtn" data-i18n="set.wipeBtn"></button>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3 data-i18n="io.title"></h3></div>
            <div class="io-grid">
              <button class="io" id="expJson">
                <div class="io-ic">⬇</div>
                <div><div class="s-title" data-i18n="io.json"></div><div class="muted small" data-i18n="io.jsonHint"></div></div>
              </button>
              <button class="io" id="expCsv">
                <div class="io-ic">⬇</div>
                <div><div class="s-title" data-i18n="io.csv"></div><div class="muted small" data-i18n="io.csvHint"></div></div>
              </button>
              <button class="io" id="impBtn">
                <div class="io-ic">⬆</div>
                <div><div class="s-title" data-i18n="io.imp"></div><div class="muted small" data-i18n="io.impHint"></div></div>
              </button>
            </div>
            <div class="muted small" id="statsInfo" style="margin-top:14px"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Transaction modal -->
  <div class="overlay" id="txModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="txModalTitle"></h3>
        <button class="icon-btn" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="type-switch" id="txType">
        <button data-v="expense" class="on" data-i18n="expense"></button>
        <button data-v="income" data-i18n="income"></button>
        <span class="glider"></span>
      </div>
      <div class="amount-box">
        <input id="txAmount" inputmode="numeric" placeholder="۰" autocomplete="off" />
        <span id="txUnit" class="muted"></span>
      </div>
      <div class="amount-words muted small" id="txWords"></div>
      <div class="field">
        <label data-i18n="field.category"></label>
        <div class="chips" id="txCats"></div>
      </div>
      <div class="row-2">
        <div class="field">
          <label data-i18n="field.date"></label>
          <div class="date-field">
            <button class="date-btn" id="txDateBtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="txDateLabel"></span></button>
            <div class="quick-dates"><button data-qd="0" data-i18n="today"></button><button data-qd="-1" data-i18n="yesterday"></button></div>
            <div class="datepicker" id="datepicker"></div>
          </div>
        </div>
      </div>
      <div class="field">
        <label data-i18n="field.note"></label>
        <input id="txNote" data-i18n-ph="note.ph" maxlength="200" />
      </div>
      <div class="modal-foot">
        <button class="btn danger ghost" id="txDelete" data-i18n="delete"></button>
        <div class="spacer"></div>
        <button class="btn soft" data-close data-i18n="cancel"></button>
        <button class="btn primary" id="txSave"><span data-i18n="save"></span> <kbd>Enter</kbd></button>
      </div>
    </div>
  </div>

  <!-- Category modal -->
  <div class="overlay" id="catModal">
    <div class="modal small-modal">
      <div class="modal-head">
        <h3 id="catModalTitle"></h3>
        <button class="icon-btn" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="field"><label data-i18n="cat.name"></label><input id="catName" maxlength="30" data-i18n-ph="cat.namePh" /></div>
      <div class="field"><label data-i18n="cat.icon"></label><div class="emoji-grid" id="catEmoji"></div></div>
      <div class="field"><label data-i18n="cat.color"></label><div class="color-grid" id="catColor"></div></div>
      <div class="modal-foot">
        <button class="btn danger ghost" id="catDelete" data-i18n="delete"></button>
        <div class="spacer"></div>
        <button class="btn soft" data-close data-i18n="cancel"></button>
        <button class="btn primary" id="catSave" data-i18n="save"></button>
      </div>
    </div>
  </div>

  <!-- First-run welcome -->
  <div class="overlay" id="welcomeModal">
    <div class="modal small-modal welcome">
      <div class="welcome-logo"><svg viewBox="0 0 24 24"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M8 14l3-3 2 2 3-4"/></svg></div>
      <h2 data-i18n="welcome.title"></h2>
      <p class="muted" data-i18n="welcome.text"></p>
      <div class="field"><label>زبان · Language</label>
        <div class="seg wide" id="wLang"><button data-v="fa">فارسی</button><button data-v="en">English</button></div></div>
      <div class="field"><label data-i18n="set.cal"></label>
        <div class="seg wide" id="wCal"><button data-v="jalali" data-i18n="cal.jalali"></button><button data-v="gregorian" data-i18n="cal.gregorian"></button></div></div>
      <div class="field"><label data-i18n="set.currency"></label>
        <div class="cur-pick"><select id="wCurrency"></select><input id="wCurCustom" class="cur-custom" maxlength="10" data-i18n-ph="cur.customPh" /></div></div>
      <div class="modal-foot"><button class="btn primary wide" id="wStart" data-i18n="welcome.start"></button></div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="overlay" id="confirmModal">
    <div class="modal small-modal">
      <h3 id="cfTitle"></h3>
      <p class="muted" id="cfText"></p>
      <div class="modal-foot" id="cfButtons"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="bridge.js"></script>
  <script src="jalali.js"></script>
  <script src="calendar.js"></script>
  <script src="i18n.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
